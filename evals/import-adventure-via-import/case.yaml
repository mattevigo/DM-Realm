schema_version: "1.1"
name: import-adventure-via-import
description: "Asked through dmr-import to add a chapter of an Adventure, the request reaches dmr-import-adventure."
tags: [import, adventure]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
    EVAL_DMR_SOURCE_IMG: http://127.0.0.1:9/img
  prompt: |
    /dm-realm:dmr-import add chapter 2 of The Salt Crypt, without its monsters and items.
