schema_version: "1.1"
name: transfer-italian
description: "Transfer from an English note into an Italian Workspace: everything translated through the Translation Glossary."
tags: [character, transfer, scenario]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
  prompt: |
    Trasferisci Tamsin Reed dal mio vecchio vault: .old-vault/Tamsin_Reed.md. Procedi pure, non serve l'anteprima.
