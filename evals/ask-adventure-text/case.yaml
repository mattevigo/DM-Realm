schema_version: "1.1"
name: ask-adventure-text
description: "An Adventure never imported into the Workspace: asked who rules a town in it, dmr-ask answers from the seeded Source Cache (Odile Vantreck, page 14), citing it, and writes nothing."
tags: [ask]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
  prompt: |
    In The Drowned Bell adventure, who rules Saltmere?
