schema_version: "1.1"
name: s95-spent-resources-party-state
description: "Structure scenario S95: a Character's spent resources after a Session go in the Campaign's Party State, linking to the Character; the Character note is unchanged."
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    After Session 08 of the Heroes campaign Ayla is down to 12 hit points and has spent two 1st-level spell slots. Record it on her note.
