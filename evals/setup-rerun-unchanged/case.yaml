schema_version: "1.1"
name: setup-rerun-unchanged
description: Re-running Setup in an unchanged Workspace creates nothing and reports that the folder is already a Workspace.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill, Write, Bash]
  prompt: |
    /dm-realm:dmr-setup English, default names, go ahead
