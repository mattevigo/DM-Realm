schema_version: "1.1"
name: session-consolidate-told
description: "Empty Live Notes and a request that tells what happened: the DM's account is saved as the Session's Live Notes, and the Session is consolidated from it."
tags: [session]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 50
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    Consolidate session 3 of the Ashfall campaign. I took no notes, so here is what happened: the party stormed the gatehouse at dawn and drove the cinder cultists into the marsh; Durga ended at 22 hit points. Apply everything without asking me first, and title it "The Gatehouse".
