schema_version: "1.1"
name: setup-rerun-statblocks-outdated
description: "A re-run in a Workspace whose Fantasy Statblocks holds an older revision of DM Realm's layouts, by the right names: Setup runs its helper and updates them, rather than judging from data.json that nothing needs doing."
tags: [setup, statblock]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_OBSIDIAN_RUNNING: "0"
  prompt: |
    /dm-realm:dmr-setup
