schema_version: "1.1"
name: campaign-change-truth
description: "A truth the DM states for a started Campaign goes into a new Truths section, in its place before Current State, with no preview; every other section stays byte for byte."
tags: [campaign]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    Add a truth to the Ashfall campaign: the moon is hollow.
