schema_version: "1.1"
name: ask-no-workspace
description: "In an empty folder, asked how to start and a rules question, dmr-ask points to /dm-realm:dmr-setup, says the rules answer needs a Workspace without asking for an Edition, runs neither Setup nor Research, and writes nothing."
tags: [ask]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    I just installed DM Realm. How do I start? And how does the Grappled condition work?
