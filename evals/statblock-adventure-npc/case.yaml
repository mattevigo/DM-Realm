schema_version: "1.1"
name: statblock-adventure-npc
description: "Adventure NPCs get their stat blocks: one the book changes extends its Reference monster with only the change; one it does not change gets a link and no fence."
tags: [statblock, scenario]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
  prompt: |
    Set up the stat blocks of Glasstaff and Mother Brine, the NPCs of The Salt Crypt.
