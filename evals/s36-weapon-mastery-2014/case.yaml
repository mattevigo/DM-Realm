schema_version: "1.1"
name: s36-weapon-mastery-2014
description: "Structure scenario S36: with the DM's consent, a 2024 Weapon Mastery enters a 2014 Workspace as Off-Edition Material, creating the Weapon_Masteries folder."
tags: [import, scenario]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
  prompt: |
    Add the Weapon Mastery property Snare. I know it's 2024 material and this Workspace follows the 2014 rules: I consent to adding it as Off-Edition Material.
