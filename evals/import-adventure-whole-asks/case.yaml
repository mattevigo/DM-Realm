schema_version: "1.1"
name: import-adventure-whole-asks
description: "Asked for the whole Adventure, Import asks once — its three Parts, their words and images, and the monsters and items they name that the Workspace lacks — and writes nothing before the answer."
tags: [import, adventure]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
    EVAL_DMR_SOURCE_IMG: http://127.0.0.1:9/img
  prompt: |
    Import the whole Salt Crypt adventure.
