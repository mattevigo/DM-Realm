schema_version: "1.1"
name: import-mixed-request
description: "One request with a normal item, an Off-Edition player option and an uncached entry while unreachable: writes the first, asks about the second, reports the third."
tags: [import]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
  prompt: |
    Add Cinder Bloom, Silver Hush and the Thornback Stalker.
