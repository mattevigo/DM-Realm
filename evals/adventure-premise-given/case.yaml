schema_version: "1.1"
name: adventure-premise-given
description: "Starting an Adventure with a pitch, levels and world: the README holds exactly those, in order, with no source property; no other note is written, and the open sections are asked."
tags: [adventure-design]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    Let's design an adventure called The Drowned Bell: a temple bell sunk in a harbour tolls at night, and the drowned answer it. It's for levels 3 to 5, set in my world Orsenna.
