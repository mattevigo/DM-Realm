schema_version: "1.1"
name: setup-mapforge-report
description: "Setup in a folder MapForge already adopted classifies it as Fresh, leaves .mapforge/ byte for byte as it was, and reports the Scopes MapForge's bestiary misses."
tags: [setup, mapforge]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_OBSIDIAN_RUNNING: "0"
  prompt: |
    /dm-realm:dmr-setup set up an English workspace, 2024 rules, default names, with stat blocks, go ahead
