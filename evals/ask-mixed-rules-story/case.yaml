schema_version: "1.1"
name: ask-mixed-rules-story
description: "A question mixing a Character, the last Session and a rule: dmr-ask finds Grull the Large ogre in Session 04's Live Notes and answers with the seeded 2024 Grapple (two sizes larger, XPHB p. 412), and writes nothing."
tags: [ask]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
  prompt: |
    Next session Durga wants to grapple the ogre that got away at the end of the last Ashfall session. Can she?
