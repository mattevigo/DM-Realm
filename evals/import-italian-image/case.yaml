schema_version: "1.1"
name: import-italian-image
description: "In an Italian Workspace an imported monster's image goes to Riferimento › Allegati, named after the translated note, which embeds it (ADR 0008)."
tags: [import]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
    EVAL_DMR_SOURCE_IMG: http://127.0.0.1:9/img
  prompt: |
    Aggiungi il mostro Wisp Hound dell'Ember Codex (EMBC). In italiano chiamalo Segugio Fatuo.
