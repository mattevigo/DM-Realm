schema_version: "1.1"
name: setup-rerun-mapforge-set
description: "Asked to point MapForge's bestiary at a folder, Setup says MapForge already reads every note in the Workspace, and writes nothing in .mapforge/."
tags: [setup, mapforge]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_OBSIDIAN_RUNNING: "0"
  prompt: |
    /dm-realm:dmr-setup point MapForge's bestiary at the Homebrew Monsters folder, go ahead
