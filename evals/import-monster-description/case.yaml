schema_version: "1.1"
name: import-monster-description
description: "A monster's description (its 5etools fluff) is imported into the note, before its stat lines and never into its stat block fence, with its image copied into Reference › Attachments, named after the note, and embedded above the text (ADR 0008)."
tags: [import, statblock]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
    EVAL_DMR_SOURCE_IMG: http://127.0.0.1:9/img
  prompt: |
    Add the Wisp Hound.
