schema_version: "1.1"
name: statblock-campaign-npc-clash
description: "A Campaign NPC whose stat block would take the name of a Reference monster's: the agent writes nothing and asks the DM for another name."
tags: [statblock, scenario]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
  prompt: |
    In the Heroes campaign, add an NPC called Bog Goblin: the chieftain of the marsh goblins. Use the Bog Goblin stat block, but with 27 hit points.
