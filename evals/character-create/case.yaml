schema_version: "1.1"
name: character-create
description: "dmr-character creates a level 1 Character: its folder and note, the player, links to its Reference notes, a missing one imported, numbers from the Trusted Source rules."
tags: [character, scenario]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
  prompt: |
    Create a new character for Baldu: Juno, a level 1 Mothfolk Lamplighter, Small, with the Lantern Keeper background.
    Standard array: the highest score in Wisdom, then Dexterity, Constitution, Intelligence, Charisma, and Strength last.
    From the background, +2 Wisdom and +1 Constitution. Skills: Religion and Stealth.
    Cantrip: Spark Wick. Prepared spell: Soft Light. She takes the class and background equipment packages.
