schema_version: "1.1"
name: research-no-refresh
description: A rules question asked while a newer release exists is answered from the pinned release, without refreshing.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Write, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: "file://~/.dm-realm/mirror/latest.json"
    EVAL_DMR_SOURCE_RAW: "file://~/.dm-realm/mirror/raw"
  prompt: |
    How does the Grappled condition work?
