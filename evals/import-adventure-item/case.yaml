schema_version: "1.1"
name: import-adventure-item
description: "An item an Adventure introduces, imported alone, goes to that Adventure's Items, with a README holding only the Adventure's title, book, levels and Parts."
tags: [import, scenario]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
  prompt: |
    Add the Brine Lantern.
