schema_version: "1.1"
name: setup-rerun-item-backfill
description: "A Setup re-run gives item notes written before DM Realm wrote the item keys item: true, and the Portrait of the one embedding its own picture; it leaves a Weapon Mastery alone, and reports what it added, the item whose picture it could not find, and MapForge's Treasury (ADR 0014)."
tags: [setup, mapforge]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_OBSIDIAN_RUNNING: "0"
  prompt: |
    /dm-realm:dmr-setup English, default names, go ahead
