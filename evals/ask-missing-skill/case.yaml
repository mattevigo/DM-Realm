schema_version: "1.1"
name: ask-missing-skill
description: "Asked how to bring an old vault in, dmr-ask says no skill migrates a whole vault, names the parts other skills do (Transfer through dmr-character, Import through dmr-import), and writes nothing."
tags: [ask]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    How do I bring my old Obsidian vault, with all my campaign notes, into this Workspace?
