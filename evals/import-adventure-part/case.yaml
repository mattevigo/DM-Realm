schema_version: "1.1"
name: import-adventure-part
description: "An English Workspace imports one Part of an Adventure, its monsters and items declined: a Part note, one note per Place, NPC, Encounter and Item heading with links (ADR 0013), the map in the Adventure's Attachments, the README listing the Part linked; nothing outside the Adventure."
tags: [import, adventure]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
    EVAL_DMR_SOURCE_IMG: http://127.0.0.1:9/img
  prompt: |
    Import chapter 1 of The Salt Crypt. Leave its monsters and items for later.
