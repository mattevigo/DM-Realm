schema_version: "1.1"
name: setup-rerun-mapforge-no-config
description: "Re-running Setup where MapForge has no config.json reports what MapForge reads of the whole Workspace, names the NPC it skips for an extends that names no monster, and creates no config.json."
tags: [setup, mapforge]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_OBSIDIAN_RUNNING: "0"
  prompt: |
    /dm-realm:dmr-setup English, default names, go ahead
