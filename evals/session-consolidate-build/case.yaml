schema_version: "1.1"
name: session-consolidate-build
description: "An item a Character found and attuned and the coins it took go into its Build after the go-ahead, the item imported from the seeded Source Cache and the numbers recomputed; what it spent goes to Party State, and the Character note names neither the Campaign nor a Session."
tags: [session]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 90
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
  prompt: |
    Consolidate session 3 of the Ashfall campaign. Apply everything you find without asking me first, importing what is needed, and title it "The Vault".
