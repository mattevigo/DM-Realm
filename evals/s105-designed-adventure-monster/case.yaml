schema_version: "1.1"
name: s105-designed-adventure-monster
description: "Structure scenario S105: a monster a designed Adventure introduces is a Homebrew monster, with no word of the Adventure; the Adventure links to it."
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    Add the Bell Wraith to The Drowned Bell, as an encounter at the Old Pier. Its stats: Medium undead, AC 13, 33 hit points (6d8 + 6), speed 0 ft., fly 40 ft. (hover), STR 6, DEX 16, CON 13, INT 10, WIS 12, CHA 15, CR 2. Toll of the Deep (action): one creature within 30 feet makes a DC 12 Wisdom saving throw or is frightened until the end of its next turn.
