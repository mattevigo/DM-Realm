schema_version: "1.1"
name: import-italian
description: "An Italian Workspace imports a spell into the translated Spells › Level_N path, with a translated source key and Glossary rows."
tags: [import]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
  prompt: |
    Aggiungi l'incantesimo Cinder Bloom.
