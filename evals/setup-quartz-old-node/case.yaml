schema_version: "1.1"
name: setup-quartz-old-node
description: "A first Setup that chooses the Player Wiki website, on a machine whose Node is too old: quartz: true is written, the helper's Node check runs, the DM is told how to install Node, and nothing is installed."
tags: [player-wiki, setup]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 500
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_NODE: "~/.dm-realm/old-node"
  prompt: |
    /dm-realm:dmr-setup English, 2024 rules, default names, with stat blocks, and yes, build the player wiki as a website too, go ahead
