schema_version: "1.1"
name: refresh-to-latest
description: Asked to update the Source Cache, the agent moves the pin to the latest release, re-fetches the cached files, reports both releases and touches no note.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Write, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: "file://~/.dm-realm/mirror/latest.json"
    EVAL_DMR_SOURCE_RAW: "file://~/.dm-realm/mirror/raw"
  prompt: |
    Update the source cache.
