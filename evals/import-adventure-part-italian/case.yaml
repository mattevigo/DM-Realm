schema_version: "1.1"
name: import-adventure-part-italian
description: "An Italian Workspace imports one Part of an Adventure, its monsters and items declined: every note in Italian, the Glossary's names reused in paths, headings and link texts, the Part's new names and terms added to the Glossary, the source property's # quoted."
tags: [import, adventure]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
    EVAL_DMR_SOURCE_IMG: http://127.0.0.1:9/img
  prompt: |
    Importa il capitolo 1 di The Salt Crypt. I mostri e gli oggetti che nomina li porto più avanti.
