schema_version: "1.1"
name: import-generic-variant
description: "A specific magic weapon the Trusted Source builds at runtime is imported as its generic variant, and the agent says so."
tags: [import]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
  prompt: |
    Add a +1 Longsword to my Reference.
