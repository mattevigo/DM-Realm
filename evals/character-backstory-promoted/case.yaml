schema_version: "1.1"
name: character-backstory-promoted
description: "A backstory naming a place that exists only in a Campaign, promoted to World on the DM's go-ahead: the World note is stripped of the Campaign and the backstory links to it."
tags: [character, scenario]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
  prompt: |
    Add to Wren's backstory that she grew up at the Gull's Rest, the inn on the coast. If the Gull's Rest needs moving to World, go ahead.
