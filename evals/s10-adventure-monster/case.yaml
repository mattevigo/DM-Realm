schema_version: "1.1"
name: s10-adventure-monster
description: "Structure scenario S10 (its Reference half): a monster printed only in an Adventure of the Workspace's Edition goes to Reference Monsters, with no callout."
tags: [import, scenario]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
  prompt: |
    Add the Salt Wight, the monster from The Salt Crypt adventure.
