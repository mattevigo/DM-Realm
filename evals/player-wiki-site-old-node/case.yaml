schema_version: "1.1"
name: player-wiki-site-old-node
description: "quartz: true but Node too old: updating the Player Wiki writes the Markdown wiki, skips the site, and tells the DM how to install Node, installing nothing."
tags: [player-wiki]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_NODE: "~/.dm-realm/old-node"
  prompt: |
    Update the player wiki.
