schema_version: "1.1"
name: campaign-create-name-only
description: "Given only a name, dmr-campaign writes the Campaign folder, its core and a README with only the name and Current State, then asks every optional question in one message."
tags: [campaign]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    Start a new campaign called Heroes of the Border.
