schema_version: "1.1"
name: transfer-past-builds
description: "A Transfer from another Workspace brings the past Builds as history: numbered from 01 in order, options as plain-text names, no links."
tags: [character, transfer, scenario, statblock]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
  prompt: |
    Transfer Oren from my other Workspace: .other-workspace/Characters/Oren. Go ahead, no need to show me a preview.
