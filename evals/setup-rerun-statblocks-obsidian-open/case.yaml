schema_version: "1.1"
name: setup-rerun-statblocks-obsidian-open
description: "The same re-run with Obsidian open: data.json is left as it is, since the plugin would overwrite it from memory, and the DM is asked to close Obsidian."
tags: [setup, statblock]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_OBSIDIAN_RUNNING: "1"
  prompt: |
    /dm-realm:dmr-setup
