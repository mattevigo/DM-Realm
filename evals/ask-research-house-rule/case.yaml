schema_version: "1.1"
name: ask-research-house-rule
description: "A rules question in a Workspace with a Homebrew House Rule on Grapple: dmr-ask gives the seeded official Grapple (two sizes larger, XPHB p. 412), then names the House Rule Giant Grapple (three sizes), and writes nothing."
tags: [ask]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
  prompt: |
    How big a creature can I grapple?
