schema_version: "1.1"
name: character-backstory-campaign-place-asks
description: "A backstory naming a place that exists only in a Campaign: the agent asks to promote it to World or keep the backstory generic, and changes nothing yet."
tags: [character, scenario]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
  prompt: |
    Add to Wren's backstory that she grew up at the Gull's Rest, the inn on the coast.
