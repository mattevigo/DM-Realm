schema_version: "1.1"
name: s103-campaign-plot-stays
description: "Structure scenario S103: a plot the DM writes for one table, in place of a chapter of an Adventure, belongs to the Campaign and is not an Adventure."
tags: [scenario]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    For the Heroes campaign I'm replacing chapter 3 of the Sunken Keep with my own dungeon, the Sunless Vault, a sealed treasury under the keep. Make a note for it.
