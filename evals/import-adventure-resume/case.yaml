schema_version: "1.1"
name: import-adventure-resume
description: "An Import stopped midway (two notes written, no Part note) resumes: the written notes are found by section id and kept as they are, the rest of the Part is written, and the Part note links to the kept notes."
tags: [import, adventure]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
    EVAL_DMR_SOURCE_IMG: http://127.0.0.1:9/img
  prompt: |
    Import chapter 1 of The Salt Crypt, without its monsters and items.
