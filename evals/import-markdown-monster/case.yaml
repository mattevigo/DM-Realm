schema_version: "1.1"
name: import-markdown-monster
description: "In a Workspace with stat_blocks: false, an imported monster's statistics are Markdown, last, after its image and description: no fence and no statblock flag (ADR 0009)."
tags: [import, statblock]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
    EVAL_DMR_SOURCE_IMG: http://127.0.0.1:9/img
  prompt: |
    Add the Wisp Hound from the Ember Codex.
