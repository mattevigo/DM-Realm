schema_version: "1.1"
name: transfer-name-clash
description: "A Transfer onto a Character name already in use stops and asks for another name; nothing is written or merged."
tags: [character, transfer, scenario]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
  prompt: |
    Transfer Wren from my old vault: .old-vault/Wren.md. Go ahead, no need to show me a preview.
