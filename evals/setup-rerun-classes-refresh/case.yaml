schema_version: "1.1"
name: setup-rerun-classes-refresh
description: "A Setup re-run refreshes the spells' Classes lines (ADR 0016): it adds the line to a spell imported before DM Realm wrote it, takes a Setting book's class Reference does not hold out of an old line, rebuilds the class's Spell Index, and reports it."
tags: [setup, import]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_OBSIDIAN_RUNNING: "0"
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
  prompt: |
    /dm-realm:dmr-setup English, default names, go ahead
