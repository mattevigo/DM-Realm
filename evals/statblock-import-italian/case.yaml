schema_version: "1.1"
name: statblock-import-italian
description: "An Italian 2024 Workspace imports a 2024 monster: its stat block fence keeps the plugin's English keys, with Italian values and the default layout."
tags: [import, statblock]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  env:
    EVAL_DMR_SOURCE_CACHE: "~/.dm-realm/source-cache"
    EVAL_DMR_SOURCE_API: http://127.0.0.1:9/latest
    EVAL_DMR_SOURCE_RAW: http://127.0.0.1:9/raw
  prompt: |
    Aggiungi il mostro Bog Goblin.
