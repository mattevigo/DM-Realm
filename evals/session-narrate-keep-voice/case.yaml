schema_version: "1.1"
name: session-narrate-keep-voice
description: "An instruction the DM asks to keep for every Chapter is written into a new Voice note in the Chronicle."
tags: [session]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 50
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    Write the chapter of session 3 of the Ashfall campaign. Tell it as a tale sung by a wandering bard, and keep that style for every chapter from now on.
