schema_version: "1.1"
name: workspace-plain-request
description: In a Workspace, a plain request with no command reaches the dmr-workspace rules and places the note correctly.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Write, Bash]
  prompt: |
    I invented a spell I want in every future campaign: Ember Lash, a 3rd-level evocation that lashes one creature with fire for 4d6 fire damage. Add it.
